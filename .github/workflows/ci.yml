name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PersonaNotesApp.slnx

      - name: Build
        run: dotnet build PersonaNotesApp.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test PersonaNotesApp.slnx --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' "$(openssl rand -hex 16)" "$(openssl rand -base64 48 | tr -d '\n')" > .env
          docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: curl --fail --silent http://localhost:8080/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
