name: Deploy

# Runs after the CI workflow succeeded on main and updates the Hetzner server over SSH.
# Needs the secrets DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (see README).
# The first run also clones the repository and creates the server's .env, so nothing has to be set up by hand.
# Optional repository variables (Settings > Secrets and variables > Actions > Variables), read on that first run only:
# LEGAL_OPERATOR_NAME and LEGAL_CONTACT_EMAIL, shown on the privacy policy and terms pages.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never run two deploys at once; a newer one waits for the running one to finish
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # The exact commit that passed CI, not whatever main points to by now
      SHA: ${{ github.event.workflow_run.head_sha }}
      URL: https://notes.cloudandbear.com

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          # Only read on the very first deploy, when the server's .env is created (edit it on the server afterwards)
          LEGAL_OPERATOR_NAME: ${{ vars.LEGAL_OPERATOR_NAME }}
          LEGAL_CONTACT_EMAIL: ${{ vars.LEGAL_CONTACT_EMAIL }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          # printf %q quotes every value, so nothing here can break out of the remote script
          {
            printf 'SHA=%q\nREPO_URL=%q\nPUBLIC_URL=%q\nOPERATOR=%q\nCONTACT=%q\n' \
              "$SHA" "$REPO_URL" "$URL" "$LEGAL_OPERATOR_NAME" "$LEGAL_CONTACT_EMAIL"
            cat <<'REMOTE'
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          cd ~

          # First deploy: fetch the code and create the .env. Its secrets are generated here and never leave the server.
          [ -d PersonaNotesApp/.git ] || git clone --quiet "$REPO_URL" PersonaNotesApp
          cd PersonaNotesApp
          if [ ! -f .env ]; then
            (
              umask 077
              printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\nAPP_PUBLIC_URL=%s\nLEGAL_OPERATOR_NAME=%s\nLEGAL_CONTACT_EMAIL=%s\n' \
                "$(openssl rand -hex 24)" "$(openssl rand -hex 32)" "$PUBLIC_URL" "$OPERATOR" "$CONTACT" > .env
            )
          fi
          docker network create edge >/dev/null 2>&1 || true

          git fetch --quiet origin
          git reset --hard "$SHA"
          # </dev/null: nothing may swallow the rest of this script from stdin
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans </dev/null
          docker image prune -f </dev/null
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$HOST" bash -s

      - name: Smoke test
        run: |
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after $attempt attempt(s)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code"
            sleep 6
          done
          echo "The site did not become healthy in time"
          exit 1
