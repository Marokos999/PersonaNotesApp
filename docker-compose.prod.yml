# Production stack for a server where a shared reverse proxy already handles HTTPS (see DevOps/hetzner-edge).
# The app joins the external `edge` network as notes-app:8080; the database is reachable inside this stack only.
#   docker compose -f docker-compose.prod.yml up -d --build
# Required variables live in .env on the server (copy .env.example to .env and fill it in).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: personanotes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personanotes"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Npgsql tries GSS encryption by default and the runtime image has no libgssapi, which logs an error on every start
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=personanotes;Username=postgres;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      Jwt__Issuer: PersonaNotesApp
      Jwt__Audience: PersonaNotesApp
      Jwt__AccessTokenExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "30"
      # The proxy sits in front, so trust X-Forwarded-For/Proto (the auth rate limiter needs the real client IP)
      ForwardedHeaders__Enabled: "true"
      # Public address (robots.txt, sitemap) and the operator details shown on the privacy policy and terms pages
      App__PublicUrl: ${APP_PUBLIC_URL:-}
      Legal__OperatorName: ${LEGAL_OPERATOR_NAME:-}
      Legal__ContactEmail: ${LEGAL_CONTACT_EMAIL:-}
    networks:
      default:
      edge:
        aliases: [notes-app]

networks:
  edge:
    external: true

volumes:
  pgdata:
